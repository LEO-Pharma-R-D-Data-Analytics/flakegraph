runtime:
  runtime: local
job:
  job_id: local-cache-smoke
  graph_id: local-cache-smoke-graph
files:
  source: local
  input_path: data/samples/smoke.txt
ocr:
  provider: builtin_text
llm:
  provider: fake
  model: fake-graph-extractor
embedding:
  provider: hash
  model: hash-embedding
  dimension: 64
graph:
  chunk_token_size: 120
  chunk_token_overlap: 20
  max_chunks_per_llm_call: 1
  gleaning_max_passes: 0
writer:
  provider: local_artifacts
  output_path: out/local-cache-smoke
cache:
  provider: local
  path: out/cache/local-cache-smoke
