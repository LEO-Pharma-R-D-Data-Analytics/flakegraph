# Default processing profile: what a run gets when nothing else is chosen.
#
# It is deliberately runnable on a laptop with no GPU. The console starts from
# this file and replaces the runtime, source, run identity, provider
# selections, writer and cache with whatever the ingestion form selects, so
# nothing here binds a fleet or a Snowflake account. Headless runs use it
# directly:
#
#   uv run flakegraph worker --config configs/app-defaults.yaml --progress rich
runtime:
  runtime: local
files:
  # The console replaces this with the selected upload, path, stage, blob
  # prefix or bucket. The public sample corpus keeps a direct run meaningful.
  source: local
  input_path: data/martial_arts/files
  include_globs:
    - "**/*"
ocr:
  # Read the text layer documents already carry; nothing to install. Scanned
  # or image-only PDFs need a layout-aware engine: switch to `fallback`, which
  # keeps coherent embedded text and hands only sparse or malformed pages to
  # MinerU, or to `mineru_internal` for every page. Both need the MinerU CLI
  # (`uv tool install --python 3.13 "mineru[pipeline]"`); see configs/README.md.
  provider: builtin_text
  fallback_primary_provider: builtin_text
  fallback_secondary_provider: mineru_internal
  fallback_min_characters_per_page: 80
  fallback_max_sparse_page_ratio: 0.2
  fallback_max_unbroken_text_ratio: 0.5
  fallback_max_fragmented_text_ratio: 0.15
  fallback_max_interleaved_column_page_ratio: 0.25
  mineru_method: ocr
  mineru_backend: pipeline
  timeout_seconds: 3600
llm:
  # A local Ollama server with an 8B Qwen3 model, which runs on a recent laptop
  # (`ollama pull qwen3:8b`). Any OpenAI-compatible endpoint, Azure OpenAI or a
  # vLLM server works in its place; configs/local-vllm-mineru-oss.yaml is the
  # GPU profile.
  provider: ollama
  endpoint: http://localhost:11434
  model: qwen3:8b
embedding:
  # Keep graph vectors independent from the generative model server so either
  # provider can be replaced without coupling their model inventories.
  provider: sentence_transformers
  # Qwen3-Embedding-0.6B: a strong open embedding model that still runs on a
  # CPU, multilingual, 1024 wide. A Snowflake destination fixes its vector
  # width when the graph tables are first created, so `dimension` must match
  # the embedding model for as long as those tables live.
  model: Qwen/Qwen3-Embedding-0.6B
  dimension: 1024
  batch_size: 32
ontology:
  # Domain datasets can select a stricter ontology, while ordinary runs use
  # this evidence-grounded vocabulary without inheriting benchmark assumptions.
  profile_path: configs/ontologies/general.yaml
extractors:
  entity_provider: llm
  relation_provider: llm
  verifier_provider: llm
writer:
  provider: local_artifacts
  output_path: out/app
cache:
  # Repeated local runs reuse OCR and extraction results. Distributed workers
  # must not depend on node-local cache affinity, so the console sets this to
  # `none` or a Snowflake cache for those runtimes.
  provider: local
  path: out/cache/app
consumption:
  # Snowflake bills Cortex in AI credits, and one credit's dollar value is a
  # property of the account's contract rather than of the model, so every model
  # below prices itself from this one number.
  #
  # Set this to your contract rate. It is zero here on purpose: a guessed
  # figure would report a confident price that is quietly wrong, so until it is
  # set, Cortex calls are counted as unpriced and reported as such rather than
  # shown as free.
  usd_per_credit: 0.0
  # What a local run would have cost had it been sent to Snowflake instead.
  # Avoided cost is meaningless without a stated alternative, and this is the
  # model the hosted runtime uses by default, so it is the honest comparison.
  local_reference: snowflake_cortex:mistral-large2
  # AI credits per unit, transcribed from Snowflake's Service Consumption Table
  # effective 7 August 2026: Table 6(a) for the AI_COMPLETE and AI_EMBED
  # functions this pipeline calls, and Table 6(g) for AI_PARSE_DOCUMENT.
  #
  # Table 6(c) quotes lower figures for several of the same models. It prices
  # the Cortex Inference REST API, which is a different service; the adapters
  # here issue AI_COMPLETE as SQL, so 6(a) is the table that applies.
  #
  # Every model Snowflake currently serves is listed, not only the ones this
  # deployment uses. The model is a free-text field in the UI, and an unlisted
  # model would be reported as an unpriced call rather than as spend.
  #
  # Rates are recorded as credits rather than pre-multiplied dollars, so
  # correcting usd_per_credit above reprices every model at once.
  rates:
    # Text generation, AI_COMPLETE. Input and output are billed at
    # different rates for every model that distinguishes them.
    snowflake_cortex:claude-4-sonnet:
      prompt_credits_per_million: 1.80
      completion_credits_per_million: 9.00
    snowflake_cortex:claude-fable-5:
      prompt_credits_per_million: 6.00
      completion_credits_per_million: 30.00
