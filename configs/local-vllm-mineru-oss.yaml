runtime:
  runtime: local
job:
  job_id: local-vllm-mineru-oss
  graph_id: local-vllm-mineru-oss-graph
files:
  source: local
  input_path: data/samples
  include_globs:
    - "**/*.pdf"
    - "**/*.docx"
    - "**/*.pptx"
    - "**/*.xlsx"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.tif"
    - "**/*.tiff"
    - "**/*.bmp"
    - "**/*.webp"
ocr:
  provider: mineru_internal
  mineru_command: mineru
  mineru_method: auto
  mineru_backend: pipeline
  mineru_effort: medium
  model_cache_dir: /home/kgprocessor/.cache/mineru
llm:
  provider: vllm_local
  endpoint: ${KG_LLM_ENDPOINT}
  model: ${KG_LLM_MODEL}
  api_key: ${KG_LLM_API_KEY}
embedding:
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
  device: ${KG_EMBED_DEVICE}
graph:
  chunk_token_size: 300
  chunk_token_overlap: 50
  max_chunks_per_llm_call: 2
  gleaning_max_passes: 1
writer:
  provider: local_artifacts
  output_path: out/local-vllm-mineru-oss
cache:
  provider: local
  path: out/cache/local-vllm-mineru-oss
