[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "flakegraph"
version = "0.1.0"
description = "Build evidence-grounded knowledge graphs on Snowflake with modular OCR, LLM, embedding, and writer providers."
readme = "README.md"
# Python 3.13 is the supported runtime across local tests, tooling, and Docker.
# Keeping one minor version avoids reviewing dependency differences between
# developer runs and the container image.
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "FlakeGraph contributors" }]
dependencies = [
  "azure-storage-blob>=12.20",
  "httpx>=0.28.0",
  "networkx>=3.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pydantic>=2.10",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "snowflake-connector-python>=3.13,!=4.7.0",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-networkx>=3.4",
  "types-PyYAML>=6.0",
]
local-embeddings = [
  "sentence-transformers>=3.3",
  "torch>=2.6,<3",
]
ocr-mineru = [
  "mineru[pipeline]==3.4.1",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[tool.uv.sources]
# Linux PyPI Torch wheels include CUDA dependency packages. The production
# container is CPU-first unless a future GPU profile is added explicitly, so
# Linux resolution is pinned to PyTorch's CPU wheel index while macOS developer
# environments can keep using the standard PyPI wheels.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
flakegraph = "kg_processor.cli:app"
kg-processor = "kg_processor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_processor"]

[tool.pytest.ini_options]
addopts = "-q --cov=kg_processor --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["kg_processor"]
