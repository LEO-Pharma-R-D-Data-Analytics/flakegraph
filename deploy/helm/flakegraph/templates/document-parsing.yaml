{{- if .Values.documentParsing.enabled }}
{{- $mineru := .Values.documentParsing.mineru }}
{{- $shim := .Values.documentParsing.shim }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.mineruName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-parsing
spec:
  # Headless so the shim resolves individual replicas and can send each request
  # to the least-loaded one. A load-balanced ClusterIP would hide the very thing
  # admission control has to count.
  clusterIP: None
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "document-parsing") | nindent 4 }}
  ports:
    - name: http
      port: {{ $mineru.service.port }}
      targetPort: http
      protocol: TCP
{{- if include "flakegraph.lanesEnabled" . }}
---
# The replicas the shim may send work to. The balancer labels each parsing
# replica with the lane of the engine on its node, and this selects only the
# batch lane - so parsing, which shares the node's GPU, never lands beside an
# engine a person is using. DNS follows the labels by itself, and the balancer
# always leaves at least one replica in the batch lane.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.mineruBatchName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-parsing
spec:
  clusterIP: None
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "document-parsing") | nindent 4 }}
    flakegraph.io/lane: batch
  ports:
    - name: http
      port: {{ $mineru.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flakegraph.mineruName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-parsing
spec:
  serviceName: {{ include "flakegraph.mineruName" . }}
  replicas: {{ $mineru.replicas }}
  podManagementPolicy: Parallel
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "document-parsing") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "document-parsing") | nindent 8 }}
        {{- if include "flakegraph.lanesEnabled" . }}
        # Every replica starts in the batch lane; the balancer moves one out
        # while an engine on its node is serving people.
        flakegraph.io/lane: batch
        {{- end }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if eq $mineru.device.mode "cuda" }}
      {{- with $mineru.device.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mineru.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mineru.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Soft, unlike the engines' anti-affinity: a parsing replica the fleet
      # cannot place alone is still worth running.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $mineru.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "flakegraph.selectorLabels" (dict "root" . "component" "document-parsing") | nindent 14 }}
      containers:
        - name: mineru
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [mineru-api]
          env:
            - name: MINERU_API_MAX_CONCURRENT_REQUESTS
              value: {{ $mineru.maxConcurrentRequests | quote }}
            - name: MINERU_MODEL_SOURCE
              value: {{ $mineru.modelSource | quote }}
            - name: MINERU_DEVICE_MODE
              value: {{ $mineru.device.mode | quote }}
            {{- if eq $mineru.device.mode "cuda" }}
            - name: MINERU_VIRTUAL_VRAM_SIZE
              value: {{ $mineru.device.virtualVramGiB | quote }}
            {{- if not $mineru.device.claimGpu }}
            # No resource claim, so the device plugin injects nothing; naming
            # every device is how the pod asks the runtime class for one it
            # shares with whatever else holds it. See device.claimGpu.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            {{- end }}
            {{- end }}
            - name: HOME
              value: /tmp/mineru-home
            # Weights are fetched once and kept on the volume, so a rescheduled
            # replica does not re-download several gigabytes before serving.
            - name: HF_HOME
              value: /models/huggingface
            - name: XDG_CACHE_HOME
              value: /models/cache
            # Each parse writes its artefacts under this root, and the image
            # defaults it to a relative path inside the read-only layer — which
            # fails the request rather than the container, so it surfaces as a
            # 500 on the first document rather than at startup.
            - name: MINERU_API_OUTPUT_ROOT
              value: /tmp/mineru-output
            {{- with $mineru.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - --host
            - 0.0.0.0
            - --port
            - {{ $mineru.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ $mineru.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- if and (eq $mineru.device.mode "cuda") $mineru.device.claimGpu }}
            {{- /* A whole device through the device plugin, so the scheduler places and accounts for it. */}}
            {{- $claimed := dict "nvidia.com/gpu" "1" }}
            {{- toYaml (dict "requests" (merge (dict) $claimed ($mineru.resources.requests | default dict)) "limits" (merge (dict) $claimed ($mineru.resources.limits | default dict))) | nindent 12 }}
            {{- else }}
            {{- toYaml $mineru.resources | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            {{- with $mineru.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $mineru.persistence.enabled }}
        - name: models
          emptyDir: {}
        {{- end }}
        {{- with $mineru.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if $mineru.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes:
          {{- toYaml $mineru.persistence.accessModes | nindent 10 }}
        {{- with $mineru.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $mineru.persistence.size }}
  {{- end }}
{{- if $mineru.autoscaling.enabled }}
{{ include "flakegraph.cpuHpa" (dict "root" . "name" (include "flakegraph.mineruName" .) "kind" "StatefulSet" "component" "document-parsing" "autoscaling" $mineru.autoscaling) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.ocrShimName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-shim
spec:
  type: ClusterIP
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "ocr-shim") | nindent 4 }}
  ports:
    - name: http
      port: {{ $shim.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flakegraph.ocrShimName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-shim
spec:
  replicas: {{ $shim.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "ocr-shim") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "ocr-shim") | nindent 8 }}
      annotations:
        checksum/ocr-shim: {{ $shim | toJson | sha256sum }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Longer than a parse so a scaled-down replica can finish what it holds.
      terminationGracePeriodSeconds: {{ add $shim.requestTimeoutSeconds 120 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ocr-shim
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [flakegraph, serving, ocr-shim]
          env:
            - name: FLAKEGRAPH_OCR_SHIM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            # One name, not a list of addresses, so the parsing pool can scale
            # underneath the shim without a configuration change.
            - name: FLAKEGRAPH_OCR_SHIM_UPSTREAM_HOST
              value: {{ include (ternary "flakegraph.mineruBatchName" "flakegraph.mineruName" (eq (include "flakegraph.lanesEnabled" .) "true")) . | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_UPSTREAM_PORT
              value: {{ $mineru.service.port | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_UPSTREAM_CAPACITY
              value: {{ $mineru.maxConcurrentRequests | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_LISTEN_PORT
              value: {{ $shim.service.port | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_KEYS_FILE
              value: {{ printf "/etc/flakegraph/ocr/%s" $shim.keySecret.key | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_BANDS
              value: {{ $shim.bands | toJson | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_POLL_INTERVAL_SECONDS
              value: {{ $shim.queuePollIntervalSeconds | quote }}
            - name: FLAKEGRAPH_OCR_SHIM_REQUEST_TIMEOUT_SECONDS
              value: {{ $shim.requestTimeoutSeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: {{ $shim.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $shim.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: ocr-keys
              mountPath: /etc/flakegraph/ocr
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ocr-keys
          secret:
            secretName: {{ $shim.keySecret.name }}
        - name: tmp
          emptyDir: {}
{{- if $shim.autoscaling.enabled }}
{{ include "flakegraph.cpuHpa" (dict "root" . "name" (include "flakegraph.ocrShimName" .) "kind" "Deployment" "component" "ocr-shim" "autoscaling" $shim.autoscaling) }}
{{- end }}
{{- end }}
