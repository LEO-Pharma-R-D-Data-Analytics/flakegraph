{{- if .Values.database.cloudNativePG.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.cloudNativePG.clusterName }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.cloudNativePG.instances }}
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  postgresql:
    parameters:
      max_connections: {{ .Values.database.cloudNativePG.maxConnections | quote }}
  {{- if .Values.monitoring.enabled }}
  monitoring:
    # The operator's exporter, scraped through the PodMonitor it creates. The
    # custom queries turn the coordination tables into series: queue depth per
    # stage and band, failures, expired leases, demand - the numbers KEDA
    # scales on, made visible. They run as the operator's own superuser over
    # the local socket, so the read-only role below is not involved.
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: {{ include "flakegraph.postgresQueriesName" . }}
        key: queries.yaml
  managed:
    roles:
      # What Grafana signs in as. Read-only over every table, including ones
      # a later schema version adds, so a dashboard never needs a grant to
      # follow a migration. The password lives in a Secret the chart keeps
      # stable across upgrades; the operator reconciles the role to match it.
      - name: {{ .Values.monitoring.database.role }}
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: {{ .Values.monitoring.database.secretName }}
        ensure: present
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database.cloudNativePG.database }}
      owner: {{ .Values.database.cloudNativePG.owner }}
  storage:
    size: {{ .Values.database.cloudNativePG.storage.size }}
    {{- with .Values.database.cloudNativePG.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.database.cloudNativePG.resources | nindent 4 }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    {{- with .Values.database.cloudNativePG.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.database.cloudNativePG.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
