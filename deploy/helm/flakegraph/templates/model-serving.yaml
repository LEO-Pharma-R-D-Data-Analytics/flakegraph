{{- if .Values.modelServing.enabled }}
{{- if ne .Values.modelServing.runtime "vllm" }}
{{- fail "modelServing.runtime must be vllm" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.modelServingName" . }}-headless
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-serving
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model-serving
  ports:
    - name: http
      port: {{ .Values.modelServing.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.modelServingName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-serving
spec:
  type: ClusterIP
  internalTrafficPolicy: {{ .Values.modelServing.service.internalTrafficPolicy }}
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model-serving
  ports:
    - name: http
      port: {{ .Values.modelServing.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.localModelServingName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-serving
spec:
  type: ClusterIP
  # This companion Service sends a worker to the vLLM pod on the same node.
  # Queue workers still claim work dynamically; locality only removes a router
  # hop and keeps each GPU fed by consumers scheduled beside it.
  internalTrafficPolicy: Local
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model-serving
  ports:
    - name: http
      port: {{ .Values.modelServing.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flakegraph.modelServingName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-serving
spec:
  serviceName: {{ include "flakegraph.modelServingName" . }}-headless
  replicas: {{ .Values.modelServing.replicas }}
  podManagementPolicy: Parallel
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model-serving
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model-serving
      annotations:
        # Restart replicas whenever either the immutable model revision or the
        # serving profile changes, even when the image itself remains pinned.
        checksum/model-serving: {{ dict "model" .Values.modelServing.model "server" .Values.modelServing.server | toJson | sha256sum }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.modelPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      runtimeClassName: {{ .Values.modelServing.runtimeClassName }}
      terminationGracePeriodSeconds: {{ .Values.modelServing.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.modelServing.podSecurityContext | nindent 8 }}
      {{- with .Values.modelServing.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.modelServing.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.modelServing.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Chart.Name }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: model-serving
              topologyKey: {{ .Values.modelServing.topologyKey }}
      containers:
        - name: vllm
          image: {{ include "flakegraph.modelServingImage" . }}
          imagePullPolicy: {{ .Values.modelServing.image.pullPolicy }}
          command: [vllm]
          args:
            - serve
            - {{ .Values.modelServing.model.name | quote }}
            - --served-model-name
            - {{ .Values.modelServing.model.name | quote }}
            - --revision
            - {{ .Values.modelServing.model.revision | quote }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.modelServing.service.port | quote }}
            - --tensor-parallel-size
            - {{ .Values.modelServing.server.tensorParallelSize | quote }}
            - --trust-remote-code
            - --quantization
            - modelopt
            - --kv-cache-dtype
            - {{ .Values.modelServing.server.kvCacheDtype | quote }}
            - --attention-backend
            - {{ .Values.modelServing.server.attentionBackend | quote }}
            - --moe-backend
            - {{ .Values.modelServing.server.moeBackend | quote }}
            - --gpu-memory-utilization
            - {{ .Values.modelServing.server.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ .Values.modelServing.server.maxModelLen | quote }}
            - --max-num-seqs
            - {{ .Values.modelServing.server.maxNumSeqs | quote }}
            - --max-num-batched-tokens
            - {{ .Values.modelServing.server.maxNumBatchedTokens | quote }}
            - --enable-chunked-prefill
            - --async-scheduling
            - --enable-prefix-caching
            - --speculative-config
            - {{ printf "{\"method\":\"mtp\",\"num_speculative_tokens\":%v,\"moe_backend\":\"triton\"}" .Values.modelServing.server.speculativeTokens | quote }}
            - --load-format
            - fastsafetensors
            - --reasoning-parser
            - qwen3
            - --tool-call-parser
            - qwen3_xml
            - --enable-auto-tool-choice
          env:
            - name: HOME
              value: /tmp/vllm-home
            - name: HF_HOME
              value: /models/huggingface
            - name: VLLM_CACHE_ROOT
              value: /models/vllm
            - name: VLLM_MARLIN_USE_ATOMIC_ADD
              value: "1"
            {{- if .Values.modelServing.huggingFaceTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelServing.huggingFaceTokenSecret.name }}
                  key: {{ .Values.modelServing.huggingFaceTokenSecret.key }}
                  optional: {{ .Values.modelServing.huggingFaceTokenSecret.optional }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modelServing.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ div .Values.modelServing.startupTimeoutSeconds 5 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.modelServing.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.modelServing.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        {{- if not .Values.modelServing.persistence.enabled }}
        - name: models
          emptyDir: {}
        {{- end }}
  {{- if .Values.modelServing.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes:
          {{- toYaml .Values.modelServing.persistence.accessModes | nindent 10 }}
        {{- with .Values.modelServing.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.modelServing.persistence.size }}
  {{- end }}
{{- end }}
