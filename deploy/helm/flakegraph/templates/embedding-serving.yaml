{{- if .Values.embeddingServing.enabled }}
{{- $embed := .Values.embeddingServing }}
{{- $name := include "flakegraph.embeddingServingName" . }}
{{- $cacheDir := printf "models--%s" (replace "/" "--" $embed.model.name) }}
{{- if not .Values.gateway.enabled }}
{{- fail "embeddingServing is reached through the gateway, which issues the keys and meters the calls; enable gateway as well." }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-serving
spec:
  type: ClusterIP
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "embedding-serving") | nindent 4 }}
  ports:
    - name: http
      port: {{ $embed.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-serving
spec:
  replicas: {{ $embed.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "embedding-serving") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "embedding-serving") | nindent 8 }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with $embed.device.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.modelServing.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $embed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $embed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The weights come from the application image, which already carries
        # them for the local embedding path. Serving the same files the workers
        # would have loaded keeps the vectors interchangeable with every graph
        # embedded before this server existed, and needs no network at start.
        - name: seed-model
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              source="${SENTENCE_TRANSFORMERS_HOME:?}/{{ $cacheDir }}"
              if [ ! -d "$source" ]; then
                echo "{{ $embed.model.name }} is not in the application image at $source;" >&2
                echo "the image was built without its embedding model preloaded." >&2
                exit 1
              fi
              mkdir -p /models/hub
              cp -R "$source" /models/hub/
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $embed.seedResources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          image: {{ include "flakegraph.componentImage" .Values.modelServing.image }}
          imagePullPolicy: {{ .Values.modelServing.image.pullPolicy | default "IfNotPresent" }}
          args:
            - {{ $embed.model.name | quote }}
            - --runner
            - pooling
            - --host
            - 0.0.0.0
            - --port
            - {{ $embed.service.port | quote }}
            - --gpu-memory-utilization
            - {{ $embed.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ $embed.maxModelLen | quote }}
            # Pooling runs one forward pass per input and never decodes, which
            # is where CUDA graphs pay off; capturing them only lengthens start.
            - --enforce-eager
          env:
            - name: HOME
              value: /tmp/vllm-home
            - name: HF_HUB_CACHE
              value: /models/hub
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            {{- if not $embed.device.claimGpu }}
            # No resource claim, so the device plugin injects nothing; naming
            # every device is how the pod asks the runtime class for one it
            # shares with the engine already on the node - as document parsing
            # does. See embeddingServing.device.claimGpu.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $embed.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- if $embed.device.claimGpu }}
            {{- $claimed := dict "nvidia.com/gpu" "1" }}
            {{- toYaml (dict "requests" (merge (dict) $claimed ($embed.resources.requests | default dict)) "limits" (merge (dict) $claimed ($embed.resources.limits | default dict))) | nindent 12 }}
            {{- else }}
            {{- toYaml $embed.resources | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.modelServing.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir:
            sizeLimit: {{ $embed.modelCacheSizeLimit }}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
{{- if $embed.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-serving
spec:
  podSelector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "embedding-serving") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The server checks no key: the gateway is the only thing that may reach
    # it, and the gateway checks the caller's virtual key and meters the call.
    - from:
        - podSelector:
            matchLabels:
              {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    {{- if .Values.monitoring.enabled }}
    - from:
        {{- include "flakegraph.prometheusPeer" . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
