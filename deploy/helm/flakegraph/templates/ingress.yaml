{{- if .Values.ingress.enabled }}
{{- $ingress := .Values.ingress }}
{{- $root := . }}
{{- /*
Every routed service is a host under one domain rather than a path under one
host, because the applications behind them assume they are mounted at the root:
Streamlit serves /_stcore, LiteLLM serves /ui and /sso/callback. Rewriting those
prefixes is a source of breakage that a hostname avoids entirely, and an OIDC
redirect URI has to be a stable absolute URL in any case.

Hosts are derived from one `domain` so an operator supplies a single name and a
single certificate. A wildcard certificate covers the lot; without one, list the
hosts explicitly in `tls.hosts`.
*/}}
{{- $routes := list }}
{{- if .Values.controlPlane.enabled }}
{{- $routes = append $routes (dict "key" "controlPlane" "name" (include "flakegraph.controlPlaneName" .) "host" $ingress.hosts.controlPlane "port" .Values.controlPlane.service.port) }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $routes = append $routes (dict "key" "gateway" "name" (include "flakegraph.gatewayName" .) "host" $ingress.hosts.gateway "port" .Values.gateway.litellm.service.port) }}
{{- end }}
{{- if .Values.documentParsing.enabled }}
{{- $routes = append $routes (dict "key" "ocr" "name" (include "flakegraph.ocrShimName" .) "host" $ingress.hosts.ocr "port" .Values.documentParsing.shim.service.port) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flakegraph.fullname" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
  {{- if or $ingress.annotations $ingress.authProxy.enabled }}
  annotations:
    {{- with $ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $ingress.authProxy.enabled }}
    # Order matters, and it is the reverse of the intuition: middlewares run
    # outermost first, so the errors middleware has to wrap the gate in order to
    # see its refusal and turn it into a redirect. Listed the other way round the
    # gate still refuses, and the browser is handed a bare 401.
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-errors@kubernetescrd,%s-%s-auth@kubernetescrd" $root.Release.Namespace (include "flakegraph.authProxyName" $root) $root.Release.Namespace (include "flakegraph.authProxyName" $root) }}
    {{- end }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ingress.tls.secretName }}
  tls:
    - secretName: {{ $ingress.tls.secretName }}
      hosts:
        {{- if $ingress.tls.hosts }}
        {{- range $ingress.tls.hosts }}
        - {{ printf "%s.%s" . $ingress.domain | quote }}
        {{- end }}
        {{- else }}
        {{- range $routes }}
        - {{ printf "%s.%s" .host $ingress.domain | quote }}
        {{- end }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ printf "%s.%s" .host $ingress.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
    {{- end }}
{{- /*
A gate that asks for a browser sign-in cannot stand in front of an interface
whose callers are programs. An SDK sent to an issuer's authorize endpoint does
not sign in - it follows a redirect it cannot satisfy, or reports the HTML it
was handed as a protocol error.

These paths already authenticate. The gateway checks a virtual key on every
request; the parsing shim checks its own keyring and answers 401 without one.
Putting a second, browser-shaped challenge in front of them does not add a
check, it removes the one that works. So they are routed by rules of their own,
without the gate's middleware - and because these rules are longer than the `/`
rules above, they are the ones that match.

Nothing here is unauthenticated. Declaring a path that does not authenticate
itself would be, which is why this is an explicit per-service list rather than
a pattern.
*/}}
{{- /*
The control plane is the one routed service that does not authenticate its own
callers: it reads the identity the gate established. Route it past the gate and
that header becomes an unauthenticated request parameter - anyone may claim to
be anyone. Nothing else in this chart can catch that, so it is refused here.
*/}}
{{- if hasKey ($ingress.machineApiPaths | default dict) "controlPlane" }}
{{- fail "ingress.machineApiPaths must not name controlPlane: the control plane authenticates by trusting the gate's identity header, so routing it past the gate would let any caller assert any identity." }}
{{- end }}
{{- $machineRoutes := list }}
{{- range $routes }}
{{- $paths := get ($ingress.machineApiPaths | default dict) .key | default list }}
{{- if $paths }}
{{- $machineRoutes = append $machineRoutes (dict "route" . "paths" $paths) }}
{{- end }}
{{- end }}
{{- if $machineRoutes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-machine-api" (include "flakegraph.fullname" $root) }}
  labels:
    {{- include "flakegraph.labels" $root | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ingress.tls.secretName }}
  tls:
    - secretName: {{ $ingress.tls.secretName }}
      hosts:
        {{- range $machineRoutes }}
        - {{ printf "%s.%s" .route.host $ingress.domain | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $machineRoutes }}
    - host: {{ printf "%s.%s" .route.host $ingress.domain | quote }}
      http:
        paths:
          {{- $service := .route }}
          {{- range .paths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service.name }}
                port:
                  number: {{ $service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
