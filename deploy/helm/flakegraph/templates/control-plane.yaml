{{- if .Values.controlPlane.enabled }}
{{- $controlPlane := .Values.controlPlane }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
---
# The control plane reads the fleet to answer "what is deployed, and does this
# run's configuration match it". It reads Secrets because preflight reports which
# fleet credentials exist, and because an environment entry may reference one -
# so this Role is read-only, but it is not harmless. Whoever can reach the
# control plane can see what it can see.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Preflight tells a pool that is scaled to zero on purpose from one that is
  # simply gone by the ScaledObject standing behind it.
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list"]
  # Recovery restarts a worker pool that has no available worker, and only
  # those: the three pools are the whole write surface, by name. Task state
  # is never touched; queued work is durable and resumes when a pool is back.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames:
      - {{ include "flakegraph.fullname" . }}-prepare
      - {{ include "flakegraph.fullname" . }}-extract
      - {{ include "flakegraph.fullname" . }}-finalize
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flakegraph.controlPlaneName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flakegraph.controlPlaneName" . }}
    namespace: {{ .Release.Namespace }}
---
# Nodes are cluster-scoped, so reading them cannot be expressed in a Role. This
# is the only cluster-wide grant the control plane holds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "flakegraph.controlPlaneName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: {{ $controlPlane.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  # The console keeps its catalog on one volume, so a second replica would
  # need that volume shared. Scaling this needs shared state, not a larger
  # number here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "control-plane") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config.content | sha256sum }}
    spec:
      serviceAccountName: {{ include "flakegraph.controlPlaneName" . }}
      # The console reads the cluster through the CLI and kubectl, which read
      # this token.
      automountServiceAccountToken: true
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          workingDir: /app/react
          # TLS terminates at the ingress, so the console serves plain HTTP
          # here and holds no key material of its own.
          command: [node, server.js]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ $controlPlane.service.port | quote }}
            - name: HOSTNAME
              value: 0.0.0.0
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            # The console shells out to the CLI installed in the image, and
            # the checkout it reads defaults from is the image's own.
            - name: FLAKEGRAPH_CLI
              value: flakegraph
            - name: FLAKEGRAPH_REPOSITORY_ROOT
              value: /app
            - name: FLAKEGRAPH_APP_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # This deployment *is* the fleet's control plane, so the runtime
            # that opens by default is the fleet, not whatever this pod ran
            # locally.
            - name: FLAKEGRAPH_APP_DEFAULT_RUNTIME
              value: kubernetes
            - name: FLAKEGRAPH_APP_REQUIRE_SIGN_IN
              value: {{ $controlPlane.auth.required | quote }}
            {{- if and .Values.ingress.enabled .Values.ingress.authProxy.enabled }}
            # A gate already authenticated this request, so the console reads
            # who the viewer is from its headers instead of signing them in a
            # second time. Sound only because the NetworkPolicy the gate
            # requires admits nothing but the ingress controller.
            - name: FLAKEGRAPH_TRUST_IDENTITY_HEADERS
              value: "true"
            - name: FLAKEGRAPH_APP_SIGN_OUT_URL
              value: {{ printf "https://%s.%s/oauth2/sign_out" .Values.ingress.authProxy.host .Values.ingress.domain | quote }}
            {{- end }}
            {{- if and .Values.monitoring.enabled .Values.ingress.enabled }}
            # The dashboards sit behind the same gate on the same domain; the
            # fleet page links to them so an operator does not need to know
            # the host.
            - name: FLAKEGRAPH_APP_GRAFANA_URL
              value: {{ printf "https://%s.%s" .Values.monitoring.grafana.host .Values.ingress.domain | quote }}
            {{- end }}
            {{- if $controlPlane.persistence.enabled }}
            - name: FLAKEGRAPH_APP_STATE_ROOT
              value: {{ $controlPlane.persistence.stateRoot | quote }}
            {{- end }}
            # The run listing reads the coordination store directly.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- if $controlPlane.ask.secretName }}
            # Questions over a graph are answered through the gateway, as an
            # interactive consumer, with a virtual key of the console's own.
            - name: FLAKEGRAPH_ASK_BASE_URL
              value: {{ include "flakegraph.gatewayEndpoint" . | quote }}
            - name: FLAKEGRAPH_ASK_MODEL
              value: {{ $controlPlane.ask.model | quote }}
            - name: FLAKEGRAPH_ASK_STRUCTURED_REASONING
              value: {{ $controlPlane.ask.structuredReasoning | quote }}
            - name: FLAKEGRAPH_ASK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $controlPlane.ask.secretName }}
                  key: {{ $controlPlane.ask.secretKey }}
            {{- end }}
            {{- with $controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- /*
            The CLI the console runs submits to the same queue, reads the same
            artifact store, and resolves the same provider placeholders as the
            workers: a run it writes is one the workers will claim, and a graph
            they publish is one it can read back.
            */ -}}
            {{- include "flakegraph.coordinationEnv" . | nindent 12 }}
            {{- include "flakegraph.consumerEnv" . | nindent 12 }}
            {{- include "flakegraph.providerSecretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $controlPlane.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml $controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/flakegraph
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Next.js keeps an on-disk cache beside its build, and the build
            # sits on the read-only image.
            - name: next-cache
              mountPath: /app/react/.next/cache
            {{- if $controlPlane.persistence.enabled }}
            - name: state
              mountPath: {{ $controlPlane.persistence.stateRoot }}
            {{- end }}
            {{- with $controlPlane.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flakegraph.configMapName" . }}
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- if $controlPlane.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "flakegraph.controlPlaneName" . }}
        {{- end }}
        {{- with $controlPlane.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if $controlPlane.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $controlPlane.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $controlPlane.persistence.size }}
{{- end }}
{{- end }}
