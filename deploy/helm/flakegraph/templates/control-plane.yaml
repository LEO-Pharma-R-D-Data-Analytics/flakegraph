{{- if .Values.controlPlane.enabled }}
{{- $controlPlane := .Values.controlPlane }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
---
# The control plane reads the fleet to answer "what is deployed, and does this
# run's configuration match it". It reads Secrets because preflight reports which
# fleet credentials exist, and because an environment entry may reference one -
# so this Role is read-only, but it is not harmless. Whoever can reach the
# control plane can see what it can see.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flakegraph.controlPlaneName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flakegraph.controlPlaneName" . }}
    namespace: {{ .Release.Namespace }}
---
# Nodes are cluster-scoped, so reading them cannot be expressed in a Role. This
# is the only cluster-wide grant the control plane holds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flakegraph.controlPlaneName" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "flakegraph.controlPlaneName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ $controlPlane.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  # Streamlit keeps session state in the process, so a second replica would serve
  # some requests from a process that has never seen the session. Scaling this
  # needs sticky sessions or shared state, not a larger number here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "flakegraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        checksum/config: {{ .Values.config.content | sha256sum }}
    spec:
      serviceAccountName: {{ include "flakegraph.controlPlaneName" . }}
      # The app queries the cluster through kubectl, which reads this token.
      automountServiceAccountToken: true
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          workingDir: /app
          # TLS terminates at the ingress, so the app serves plain HTTP here and
          # holds no key material of its own.
          command:
            - streamlit
            - run
            - app/streamlit_app.py
            - --server.address
            - 0.0.0.0
            - --server.port
            - {{ $controlPlane.service.port | quote }}
            - --server.headless
            - "true"
            - --browser.gatherUsageStats
            - "false"
          env:
            - name: HOME
              value: /tmp
            # The control plane shells out to `uv run flakegraph`, and uv wants a
            # cache it can write. The root filesystem is deliberately read-only,
            # so point it at the one writable mount rather than relaxing that.
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            # The project is already installed into the image's environment, so
            # `uv run` must use it rather than re-syncing it - which it cannot do
            # against a read-only /opt/venv, and should not do in any case.
            - name: UV_NO_SYNC
              value: "1"
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: PYTHONPATH
              value: /app/app
            - name: FLAKEGRAPH_APP_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # This deployment *is* the fleet's control plane, so the runtime that
            # opens by default is the fleet, not whatever this pod ran locally.
            - name: FLAKEGRAPH_APP_DEFAULT_RUNTIME
              value: Kubernetes
            - name: FLAKEGRAPH_APP_REQUIRE_SIGN_IN
              value: {{ $controlPlane.auth.required | quote }}
            {{- if $controlPlane.persistence.enabled }}
            - name: FLAKEGRAPH_APP_STATE_ROOT
              value: {{ $controlPlane.persistence.stateRoot | quote }}
            {{- end }}
            {{- with $controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $controlPlane.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml $controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/flakegraph
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $controlPlane.persistence.enabled }}
            - name: state
              mountPath: {{ $controlPlane.persistence.stateRoot }}
            {{- end }}
            {{- if $controlPlane.auth.secretName }}
            # subPath so the image's own .streamlit/config.toml survives; a
            # directory mount would hide it.
            - name: streamlit-secrets
              mountPath: /app/app/.streamlit/secrets.toml
              subPath: {{ $controlPlane.auth.secretKey }}
              readOnly: true
            {{- end }}
            {{- with $controlPlane.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flakegraph.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- if $controlPlane.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "flakegraph.controlPlaneName" . }}
        {{- end }}
        {{- if $controlPlane.auth.secretName }}
        - name: streamlit-secrets
          secret:
            secretName: {{ $controlPlane.auth.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- with $controlPlane.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if $controlPlane.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flakegraph.controlPlaneName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $controlPlane.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $controlPlane.persistence.size }}
{{- end }}
{{- end }}
