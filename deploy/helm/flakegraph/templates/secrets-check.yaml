{{- if .Values.secretsCheck.enabled }}
{{- $name := printf "%s-secrets-check" (include "flakegraph.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $refs := include "flakegraph.referencedSecrets" . | fromJsonArray }}
{{- /*
Every Secret this chart mounts is the operator's to create, and a missing one
does not fail the install: the pod that needs it sits in ContainerCreating or
CreateContainerConfigError after Helm has already reported success, one Secret
at a time. This hook runs before anything is applied, reads every referenced
Secret by name, and refuses the install with the full list of what is missing.
The list comes from the same helper the console's read grant is built from, so
what is checked is exactly what the release will mount.

The Job's own ServiceAccount is granted `get` on those names and nothing else,
and every object here is a hook, created before the install and removed once
the check has passed.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-check
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-check
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range include "flakegraph.referencedSecretNames" . | fromJsonArray }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-check
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-check
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "secrets-check") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: check
          # The application image carries kubectl; no second image to trust.
          image: {{ include "flakegraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -u
              missing=0
              check() {
                # $1 Secret, $2 key ("" for the whole object), $3 purpose.
                if ! kubectl get secret "$1" -n {{ .Release.Namespace | quote }} -o name >/dev/null 2>&1; then
                  echo "MISSING secret/$1 - $3"
                  missing=$((missing + 1))
                  return
                fi
                if [ -n "$2" ]; then
                  keys="$(kubectl get secret "$1" -n {{ .Release.Namespace | quote }} -o go-template='{{ "{{" }}range $k, $v := .data{{ "}}" }}{{ "{{" }}$k{{ "}}" }} {{ "{{" }}end{{ "}}" }}')"
                  case " $keys " in
                    *" $2 "*) echo "ok      secret/$1 key $2" ;;
                    *) echo "MISSING secret/$1 key $2 - $3"; missing=$((missing + 1)) ;;
                  esac
                else
                  echo "ok      secret/$1"
                fi
              }
              {{- range $refs }}
              check {{ .name | quote }} {{ .key | quote }} {{ .purpose | quote }}
              {{- end }}
              if [ "$missing" -gt 0 ]; then
                echo
                echo "$missing required Secret(s) or key(s) are absent from namespace {{ .Release.Namespace }}."
                echo "Create them (see the chart README, 'Secrets the chart expects'), or set"
                echo "secretsCheck.enabled=false to skip this check."
                exit 1
              fi
              echo "every Secret the release references is present"
          env:
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.secretsCheck.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
