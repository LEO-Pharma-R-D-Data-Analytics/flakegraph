{{- if .Values.spark.enabled }}
{{- if .Values.spark.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flakegraph.sparkServiceAccountName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flakegraph.sparkRbacName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    # Spark deletes executor resources with the Kubernetes collection-delete
    # endpoint during driver shutdown, so `deletecollection` is distinct from
    # the ordinary single-resource `delete` permission.
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flakegraph.sparkRbacName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flakegraph.sparkServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flakegraph.sparkRbacName" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flakegraph.fullname" . }}-spark-executor-template
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.spark.executorPodSecurityContext | nindent 8 }}
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.sparkPriorityClassName" . }}
      {{- end }}
      {{- with .Values.spark.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          # Prefer one executor per node for parallel throughput, but keep the
          # job schedulable when a node is drained or a smaller fleet is used.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.spark.topologyKey }}
                labelSelector:
                  matchLabels:
                    spark-role: executor
      containers:
        - name: spark-kubernetes-executor
          securityContext:
            {{- toYaml .Values.spark.executorContainerSecurityContext | nindent 12 }}
{{- end }}
