{{- /*
The proxy's configuration, held in a template of its own so the Deployment can
hash exactly what the ConfigMap carries. Hashing the values that feed it is not
the same thing: a key outside this block - monitoring, the model name - changes
the file without changing the hash, and the pods keep serving the old one.
*/}}
{{- define "flakegraph.gatewayConfig" -}}
{{- $litellm := .Values.gateway.litellm -}}
model_list:
  - model_name: {{ $litellm.aliases.interactive }}
    litellm_params:
      model: hosted_vllm/{{ .Values.modelServing.model.name }}
      api_base: {{ include "flakegraph.inferenceRouterEndpoint" . }}
      api_key: os.environ/{{ $litellm.upstreamKeySecret.interactiveKey }}
  - model_name: {{ $litellm.aliases.dev }}
    litellm_params:
      model: hosted_vllm/{{ .Values.modelServing.model.name }}
      api_base: {{ include "flakegraph.inferenceRouterEndpoint" . }}
      api_key: os.environ/{{ $litellm.upstreamKeySecret.devKey }}
  - model_name: {{ $litellm.aliases.batch }}
    litellm_params:
      model: hosted_vllm/{{ .Values.modelServing.model.name }}
      api_base: {{ include "flakegraph.inferenceRouterEndpoint" . }}
      api_key: os.environ/{{ $litellm.upstreamKeySecret.batchKey }}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  {{- if $litellm.spendLogging.enabled }}
  # The batch pipeline is metered like every other tenant, which at corpus
  # scale is millions of rows. Batching the writes keeps that off the
  # request path instead of paying a database round trip per completion.
  proxy_batch_write_at: {{ $litellm.spendLogging.batchWriteIntervalSeconds }}
  {{- else }}
  disable_spend_logs: true
  {{- end }}
litellm_settings:
  # The pipeline sends chat_template_kwargs to disable Qwen's free-form
  # reasoning before strict JSON generation. Dropping unrecognised parameters
  # would remove it silently, and the failure would surface as empty
  # extractions rather than as an error.
  drop_params: false
  {{- if .Values.monitoring.enabled }}
  # Serves /metrics: request, token, and spend series per virtual key and
  # alias, which is where the fleet's per-consumer view of inference lives.
  # Off without a scraper, because the callback is not free per request.
  callbacks: ["prometheus"]
  {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $litellm := .Values.gateway.litellm }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  # One alias per consumer class, each presenting a different upstream key. The
  # sidecar maps that key to a band, so a caller's priority is decided by which
  # alias its virtual key may reach — never by anything in the request body.
  # Restrict each virtual key to a single alias and the mapping is unforgeable.
  config.yaml: |
    {{- include "flakegraph.gatewayConfig" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $litellm.service.type }}
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $litellm.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq $litellm.service.type "NodePort") $litellm.service.nodePort }}
      nodePort: {{ $litellm.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $litellm.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        # Two hashes, two reasons to roll. The values one catches changes to
        # the Secret references and arguments below; the config one catches
        # the file, whose inputs are not all under gateway.litellm.
        checksum/gateway-config: {{ $litellm | toJson | sha256sum }}
        checksum/config: {{ include "flakegraph.gatewayConfig" . | sha256sum }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $litellm.podSecurityContext | nindent 8 }}
      {{- with $litellm.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ include "flakegraph.componentImage" $litellm.image }}
          imagePullPolicy: {{ $litellm.image.pullPolicy }}
          args: [--config, /etc/litellm/config.yaml, --port, {{ $litellm.service.port | quote }}]
          env:
            # Composed rather than taken straight from the Secret so the schema
            # travels with it; Kubernetes expands $(VAR) against earlier entries.
            - name: FLAKEGRAPH_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: DATABASE_URL
              value: {{ printf "$(FLAKEGRAPH_DATABASE_URI)%s" $litellm.databaseUrlSuffix | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.virtualKeySecret.name }}
                  key: {{ $litellm.virtualKeySecret.masterKey }}
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.virtualKeySecret.name }}
                  key: {{ $litellm.virtualKeySecret.saltKey }}
            {{- range $class, $secretKey := dict "interactive" $litellm.upstreamKeySecret.interactiveKey "dev" $litellm.upstreamKeySecret.devKey "batch" $litellm.upstreamKeySecret.batchKey }}
            - name: {{ $secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.upstreamKeySecret.name }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- with $litellm.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $litellm.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $litellm.resources | nindent 12 }}
          securityContext:
            {{- toYaml $litellm.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with $litellm.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flakegraph.gatewayName" . }}
        - name: tmp
          emptyDir: {}
        {{- with $litellm.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if $litellm.autoscaling.enabled }}
{{- /* Sized against total request rate, which the batch pipeline dominates —
     not against tenant count. CPU is the observable proxy for that here. */}}
{{ include "flakegraph.cpuHpa" (dict "root" . "name" (include "flakegraph.gatewayName" .) "kind" "Deployment" "component" "gateway" "autoscaling" $litellm.autoscaling) }}
{{- end }}
{{- end }}
