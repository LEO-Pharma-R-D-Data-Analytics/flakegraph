name: Publish images

# Builds the application and Spark images for amd64 and arm64 and pushes them
# to GHCR under this repository's own name, so the chart's default
# image.repository resolves for anyone installing from a release tag. A fork
# publishes to its own ghcr.io/<owner>/... by the same workflow, and points
# image.repository there.
#
# Tags: the release version (v1.2.3 -> 1.2.3, which is what the chart's
# appVersion names) and the commit. Signing is optional: when the repository
# opts in with the vars.COSIGN_SIGN variable, each pushed digest is signed
# keylessly with the workflow's OIDC identity.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: flakegraph
            dockerfile: Dockerfile
          - name: flakegraph-spark
            dockerfile: Dockerfile.spark
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # arm64 layers are built under emulation on the amd64 runner; the CUDA
      # and MinerU layers make that slow (about an hour) but it needs no
      # self-hosted runner. Free the runner's disk first: the image is large.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Lower-cased: GHCR refuses upper-case repository paths, and the
          # organisation name is mixed-case.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          provenance: false

      - name: Install cosign
        if: vars.COSIGN_SIGN == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed digest
        if: vars.COSIGN_SIGN == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
