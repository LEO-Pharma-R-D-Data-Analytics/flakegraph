name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==0.11.19"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/kg_processor tests

      - name: Pytest
        run: uv run pytest

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run lightweight smoke profile
        run: docker compose -f .github/docker-compose.smoke.yaml up --build --abort-on-container-exit --exit-code-from flakegraph flakegraph

      - name: Tear down smoke profile
        if: always()
        run: docker compose -f .github/docker-compose.smoke.yaml down --volumes --remove-orphans
