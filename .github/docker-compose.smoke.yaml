services:
  flakegraph:
    platform: linux/amd64
    build:
      context: ..
      args:
        KG_INSTALL_MINERU: "false"
        KG_INSTALL_LOCAL_EMBEDDINGS: "false"
    image: flakegraph:local
    command: ["worker", "--config", "configs/local-smoke.yaml"]
    volumes:
      - ../data:/app/data:ro
      - ../out:/app/out

  flakegraph-mineru:
    profiles: ["mineru"]
    platform: linux/amd64
    build:
      context: ..
      args:
        KG_INSTALL_MINERU: "true"
    image: flakegraph:mineru
    command: ["worker", "--config", "configs/local-mineru-smoke.yaml"]
    volumes:
      - ../data:/app/data:ro
      - ../out:/app/out
      - mineru-cache:/home/kgprocessor/.cache/mineru

  flakegraph-mineru-api:
    profiles: ["mineru-api"]
    platform: linux/amd64
    build:
      context: ..
      args:
        KG_INSTALL_MINERU: "false"
        KG_INSTALL_LOCAL_EMBEDDINGS: "false"
    image: flakegraph:local
    command: ["worker", "--config", "configs/local-mineru-api.yaml"]
    environment:
      KG_MINERU_API_URL: ${KG_MINERU_API_URL:-}
      KG_MINERU_API_KEY: ${KG_MINERU_API_KEY:-}
      KG_LLM_ENDPOINT: ${KG_LLM_ENDPOINT:-}
      KG_LLM_MODEL: ${KG_LLM_MODEL:-}
      KG_LLM_API_KEY: ${KG_LLM_API_KEY:-}
      KG_EMBED_ENDPOINT: ${KG_EMBED_ENDPOINT:-}
      KG_EMBED_MODEL: ${KG_EMBED_MODEL:-}
      KG_EMBED_API_KEY: ${KG_EMBED_API_KEY:-}
    volumes:
      - ../data:/app/data:ro
      - ../out:/app/out

  flakegraph-tesseract:
    profiles: ["tesseract"]
    platform: linux/amd64
    build:
      context: ..
      args:
        KG_INSTALL_LOCAL_EMBEDDINGS: "false"
        KG_INSTALL_MINERU: "false"
        KG_INSTALL_TESSERACT: "true"
    image: flakegraph:tesseract
    command: ["preflight", "--config", "configs/local-tesseract-smoke.yaml"]
    volumes:
      - ../data:/app/data:ro
      - ../out:/app/out

  flakegraph-vllm:
    profiles: ["vllm"]
    platform: linux/amd64
    build:
      context: ..
      args:
        KG_INSTALL_MINERU: "true"
        KG_INSTALL_LOCAL_EMBEDDINGS: "true"
    image: flakegraph:mineru-oss
    command: ["worker", "--config", "configs/local-vllm-mineru-oss.yaml"]
    environment:
      KG_LLM_ENDPOINT: ${KG_LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      KG_LLM_MODEL: ${KG_LLM_MODEL:-qwen2.5}
      KG_LLM_API_KEY: ${KG_LLM_API_KEY:-}
      KG_EMBED_DEVICE: ${KG_EMBED_DEVICE:-cpu}
    volumes:
      - ../data:/app/data:ro
      - ../out:/app/out
      - mineru-cache:/home/kgprocessor/.cache/mineru

volumes:
  mineru-cache:
